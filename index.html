<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#271914">
<title>UCHRONIES — Le cabinet des possibles</title>
<style>
:root{
  --ink:#2a211c;--paper:#efe2c5;--paper2:#e3cda1;--wine:#74283a;--wine2:#4d1825;
  --gold:#b58b45;--desk:#17100d;--muted:#746659;--line:#b49361;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--desk);color:var(--ink)}
body{font-family:Georgia,"Times New Roman",serif;background:
radial-gradient(circle at 18% 0,rgba(255,224,164,.08),transparent 28rem),
linear-gradient(135deg,#271914,#110c0a 75%);padding:clamp(10px,2vw,24px)}
.shell{max-width:1240px;margin:auto}
header{display:flex;align-items:end;justify-content:space-between;gap:20px;padding:15px 4px 22px;color:#f4e7cd}
.eyebrow{font:700 .72rem/1.1 system-ui,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#c7a76d}
h1{margin:.25rem 0 0;font-size:clamp(2rem,7vw,5rem);line-height:.88;letter-spacing:-.045em}
header p{max-width:52ch;margin:0;color:#d2c2aa;font-size:.94rem;line-height:1.45}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.chip{border:1px solid rgba(236,219,188,.27);background:rgba(239,226,197,.06);color:#e7d8be;
padding:7px 10px;border-radius:999px;font:700 .69rem system-ui,sans-serif;cursor:pointer}
.chip.active{background:#e7d8be;color:#3a251c;border-color:#e7d8be}
.count{margin-left:auto;color:#bda98c;font:600 .72rem system-ui,sans-serif}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.card{position:relative;display:flex;min-height:330px;overflow:hidden;border-radius:18px;text-decoration:none;color:white;
border:1px solid rgba(246,229,194,.22);box-shadow:0 18px 40px rgba(0,0,0,.24);
transform:translateY(0);transition:.18s ease;background:#4b2c24}
.card:hover{transform:translateY(-3px);border-color:rgba(246,229,194,.55)}
.cover{position:absolute;inset:0;background-size:cover;background-position:center;filter:saturate(.82)}
.cover:after{content:"";position:absolute;inset:0;background:
linear-gradient(180deg,rgba(11,8,7,.05),rgba(11,8,7,.28) 44%,rgba(11,8,7,.92) 100%)}
.fallback{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden;background:
radial-gradient(circle at 80% 15%,rgba(235,198,122,.24),transparent 32%),
linear-gradient(145deg,var(--c1,#7b2c3c),var(--c2,#251919))}
.fallback:before{content:"";position:absolute;width:65%;aspect-ratio:1;border:1px solid rgba(250,231,190,.2);border-radius:50%;
box-shadow:0 0 0 28px rgba(250,231,190,.045),0 0 0 60px rgba(250,231,190,.025);right:-10%;top:-15%}
.monogram{font-size:clamp(4rem,10vw,7.5rem);font-weight:700;opacity:.16;letter-spacing:-.1em}
.content{position:relative;z-index:2;margin-top:auto;padding:22px;width:100%}
.meta{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:8px;font:700 .64rem system-ui,sans-serif;text-transform:uppercase;letter-spacing:.08em;color:#e8d8bb}
.badge{padding:4px 7px;border:1px solid rgba(255,255,255,.26);border-radius:999px;background:rgba(0,0,0,.14);backdrop-filter:blur(5px)}
.card h2{margin:0 0 7px;font-size:clamp(1.5rem,3vw,2.35rem);line-height:.96}
.card p{margin:0;max-width:48ch;color:#e7ddcf;font-size:.82rem;line-height:1.35}
.play{display:inline-flex;margin-top:13px;font:800 .67rem system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#f2dba9}
.empty,.error{grid-column:1/-1;padding:34px;border:1px dashed #856e57;border-radius:16px;color:#dac9ae;text-align:center}
footer{padding:24px 2px 6px;color:#8e7b67;font:600 .67rem system-ui,sans-serif;text-align:center}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}header{align-items:start;flex-direction:column}}
@media(max-width:560px){body{padding:8px}.grid{grid-template-columns:1fr}.card{min-height:270px}header{padding:11px 5px 16px}.toolbar{padding:0 2px}}
</style>
</head>
<body>
<div class="shell">
<header>
  <div><div class="eyebrow">Le cabinet des possibles</div><h1>UCHRONIES</h1></div>
  <p>Une collection d’histoires alternatives interactives. Changez une décision, puis regardez le monde se réécrire.</p>
</header>
<div class="toolbar" id="filters"><button class="chip active" data-tag="">Toutes</button><span class="count" id="count"></span></div>
<main class="grid" id="grid"><div class="empty">Chargement du catalogue…</div></main>
<footer>Le catalogue se met à jour automatiquement à chaque publication.</footer>
</div>
<script>
const grid=document.getElementById('grid'), filters=document.getElementById('filters'), count=document.getElementById('count');
let games=[],activeTag='';

function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function colors(g){
 const x=((g.title||'')+' '+(g.tags||[]).join(' ')).toLowerCase();
 if(/rome|urbs|antiqu|empire romain/.test(x))return['#8b4d33','#35241c'];
 if(/guerre|1939|1940|1945|occupation/.test(x))return['#465157','#1a2023'];
 if(/louis|grand dessein|monarch|roya/.test(x))return['#243e62','#8a6b31'];
 if(/alternance|président|politique|élection|fn|front national/.test(x))return['#5b2741','#253a5d'];
 if(/révolution|1789|an i|napol/.test(x))return['#7e2637','#2b2520'];
 return['#74503d','#2a201b'];
}
function monogram(t='U'){return t.replace(/^(l['’]|le |la |les |un |une )/i,'').trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()}
function isNew(g){if(!g.addedAt)return false;const d=new Date(g.addedAt);return Date.now()-d.getTime()<14*864e5}
function render(){
 const list=games.filter(g=>g.published!==false && (!activeTag || (g.tags||[]).includes(activeTag)))
   .sort((a,b)=>(a.order??999)-(b.order??999)||new Date(b.addedAt||0)-new Date(a.addedAt||0));
 count.textContent=list.length+' jeu'+(list.length>1?'x':'');
 if(!list.length){grid.innerHTML='<div class="empty">Aucune uchronie publiée dans cette catégorie.</div>';return}
 grid.innerHTML=list.map(g=>{
   const [c1,c2]=colors(g), safeThumb=g.thumbnail?encodeURI(String(g.thumbnail)).replace(/'/g,'%27'):'', thumb=safeThumb?`<div class="cover" style="background-image:url('${safeThumb}')" onerror="this.remove()"></div>`:'';
   const tags=(g.tags||[]).slice(0,2).map(t=>`<span class="badge">${esc(t)}</span>`).join('');
   return `<a class="card" href="${esc(g.file)}">
    <div class="fallback" style="--c1:${c1};--c2:${c2}"><div class="monogram">${esc(monogram(g.title))}</div></div>${thumb}
    <div class="content"><div class="meta"><span>${esc(g.period||'Uchronie')}</span>${tags}${isNew(g)?'<span class="badge">Nouveau</span>':''}</div>
    <h2>${esc(g.title||'Sans titre')}</h2><p>${esc(g.description||'Une nouvelle bifurcation de l’Histoire vous attend.')}</p>
    <span class="play">Entrer dans l’Histoire →</span></div></a>`
 }).join('');
}
function buildFilters(){
 const tags=[...new Set(games.filter(g=>g.published!==false).flatMap(g=>g.tags||[]))].slice(0,8);
 filters.querySelectorAll('.chip:not([data-tag=""])').forEach(x=>x.remove());
 tags.forEach(t=>{const b=document.createElement('button');b.className='chip';b.dataset.tag=t;b.textContent=t;b.onclick=()=>selectTag(t);filters.insertBefore(b,count)});
}
function selectTag(t){activeTag=t;document.querySelectorAll('.chip').forEach(b=>b.classList.toggle('active',b.dataset.tag===t));render()}
document.querySelector('.chip').onclick=()=>selectTag('');

fetch('./uchronies.json?v='+Date.now(),{cache:'no-store'})
 .then(r=>{if(!r.ok)throw new Error('Catalogue introuvable');return r.json()})
 .then(data=>{games=Array.isArray(data)?data:(data.games||[]);buildFilters();render()})
 .catch(e=>{grid.innerHTML='<div class="error"><b>Impossible de charger uchronies.json.</b><br>Ouvrez l’atelier d’administration pour initialiser le catalogue.</div>';count.textContent=''});
</script>
</body>
</html>
